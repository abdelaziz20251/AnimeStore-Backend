[phases.setup]
nixPkgs = ["python3", "postgresql_16.dev", "gcc"]

# Let Nixpacks auto-detect and handle install phase (venv creation and pip install)

[start]
cmd = "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile - --error-logfile -"

